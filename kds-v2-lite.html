<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KDS 2.0 Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════════════════
   Design tokens — Figma: KDS 2.0 (46CVabC5jHfBAZLA0H5W8L, 7:1031)
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Brand */
  --brand-primary:#58B6A8;
  --brand-primary-dark:#279684;
  --brand-secondary:#272A3A;
  --brand-bg:#F5F8F9;
  /* Gray */
  --white:#FFFFFF; --g1:#F4F4F5; --g2:#E4E4E7; --g3:#D4D4D8; --g4:#A1A1AA;
  /* Text */
  --t-primary:#3F3F46; --t-secondary:#71717A; --t-disable:#D4D4D8;
  /* State */
  --error:#FF8A80; --error-light:#FDEDED;
  --warning:#FFAB40; --warning-light:#FFF4E5;
  --info:#5292D9; --info-dark:#014361;
  /* 服務類型固定色票（PRD §2.2 色塊顯示 / §5.3 不開放客製，深淺模式共用）
     icon 一律白色，換色票時請留意與白色的對比 */
  --svc-dinein:#FFAB40;      /* 內用 */
  --svc-takeout:#5292D9;     /* 外帶 */
  --svc-delivery:#9A82CE;    /* 外送 */
  --svc-ubereats:#06C167;    /* Uber Eats 品牌色 */
  --svc-foodpanda:#D70F64;   /* foodpanda 品牌色 */
  /* Radius */
  --r-xs:4px; --r-md:8px; --r-xl:16px; --r-full:9999px;
  /* Shadow4 */
  --shadow4:0px 24px 40px rgba(24,24,27,0.1), 0px 0px 1px rgba(24,24,27,0.1);
  /* 設計稿 Font Size token：品項字體大小 S / M / L（由設定寫入，預設 M）
     Item-Text      24 / 32 / 36
     Attribute-Text 20 / 24 / 28 */
  --item-fs:32px; --attr-fs:24px;
}

/* ── Light theme ───────────────────────────────────────────── */
html[data-theme="light"]{
  --page:#F5F8F9;
  --surface:#FFFFFF;
  --surface-alt:#F4F4F5;
  --border:#E4E4E7;
  --pressed:#E4E4E7;
  --text:#3F3F46;
  --text-sub:#71717A;
  --text-disable:#D4D4D8;
  --overlay:rgba(24,24,27,0.4);
  --error-strong:#D0342C;    /* 徽章／電量危險：error #FF8A80 壓暗至白底 AA */
  --warning-strong:#B26A00;  /* 電量偏低：warning #FFAB40 壓暗至白底 AA */
  --meta-bg:#F5F8F9;
  --meta-ready-bg:#EAF2FB;
  --state-ready:#5292D9;
  --notif-unread-bg:#E1F2F0;   /* 設計稿：通知未讀卡片底色（外框與圓點用 brand-primary #58B6A8）*/
  --seat:#D0342C;            /* 保留：PRD §2.2 的後結座位紅字。目前不顯示（已由加點標籤取代） */
  --toast-bg:#272A3A;
  --toast-fg:#FFFFFF;
  --cta-brand-bg:#58B6A8;
  --cta-brand-pressed:#279684;
  --dropdown-item-bg:#E4E4E7;
  --dropdown-item-border:transparent;
  --dropdown-item-pressed:#D4D4D8;
  --menu-shadow:0px 24px 40px rgba(24,24,27,0.18), 0px 0px 1px rgba(24,24,27,0.16);
  --menu-ring:transparent;
}

/* ── Dark theme (WCAG AA/AAA tuned) ────────────────────────── */
html[data-theme="dark"]{
  --page:#0A0C10;
  --surface:#1E232E;
  --surface-alt:#2A2F3B;
  --border:#404656;
  --pressed:#525866;
  --text:#ECEDEE;
  --text-sub:#B8BCC4;
  --text-disable:#7A7F8C;
  --overlay:rgba(0,0,0,0.65);
  --error-strong:#FF8A80;    /* 深色模式改用亮紅，對 surface ≈ 7:1 */
  --warning-strong:#FFAB40;
  --meta-bg:#2A2F3B;
  --meta-ready-bg:#16304A;
  --state-ready:#5292D9;
  --notif-unread-bg:#16332F;   /* 深色模式對應色，維持與淺色相同的「淡品牌綠」語意 */
  --seat:#FF8A80;            /* 深色模式改用亮紅，對 surface ≈ 7:1 */
  --toast-bg:#404656;
  --toast-fg:#FFFFFF;
  --cta-brand-bg:#279684;
  --cta-brand-pressed:#155F53;
  --dropdown-item-bg:#6B7387;
  --dropdown-item-border:#8089A0;
  --dropdown-item-pressed:#8089A0;
  --menu-shadow:0px 16px 40px rgba(0,0,0,0.55), 0px 4px 10px rgba(0,0,0,0.4);
  --menu-ring:#404656;
  --error-light:#3A1F1D;
  --warning-light:#3A2C16;
}

/* ═══ Base ═══ */
*,*::before,*::after{box-sizing:border-box;}
html{line-height:1.5;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Open Sans','Noto Sans TC',sans-serif;
  background:var(--page);
  color:var(--text);
  overflow:hidden;
  line-height:inherit;
}
button,input{font-family:inherit;font-size:100%;line-height:inherit;color:inherit;margin:0;}
.icon{display:inline-flex;align-items:center;justify-content:center;}
.icon svg{display:block;}

/* ═══ Animations (v2.css) ═══ */
@keyframes v2FadeOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.94)}}
@keyframes v2SlideIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes v2ToastIn{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
@keyframes v2DropdownIn{0%{opacity:0;transform:translateY(-8px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes v2Blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
.v2-fade-out{animation:v2FadeOut .35s ease-out forwards;}
.v2-slide-in{animation:v2SlideIn .25s ease-out;}
.v2-toast-in{animation:v2ToastIn .25s ease-out;}
.v2-dropdown-in{animation:v2DropdownIn .18s ease-out;transform-origin:top left;}
.v2-blink{animation:v2Blink 1s step-start infinite;}

/* ═══ Layout ═══ */
.app{background:var(--page);height:100vh;display:flex;flex-direction:column;color:var(--text);overflow:hidden;}
.topbar{height:100px;padding:20px;background:var(--surface);border-bottom:2px solid var(--border);display:flex;align-items:center;gap:24px;flex-shrink:0;}
.divider-v{width:1px;height:32px;background:var(--border);flex-shrink:0;}
.body-row{display:flex;flex:1;overflow:hidden;}
.siderail{width:80px;background:var(--surface);border-right:2px solid var(--border);padding:20px 0;display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.toolbar{display:flex;flex-direction:column;gap:12px;align-items:center;}
.content{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}

/* ═══ IconButton (Figma 70:749) ═══ */
.iconbtn{width:60px;height:60px;padding:12px;border-radius:var(--r-md);border:2px solid var(--border);
  background:var(--surface-alt);color:var(--text);display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;transition:background .08s linear;}
.iconbtn:active{background:var(--g2);}
/* Dialog 標題列的 [X]：底色／外框與 KDS 灰色按鈕（.btn.gray）一致 */
.iconbtn.sm{width:48px;height:48px;padding:10px;
  background:var(--dropdown-item-bg);border:2px solid var(--dropdown-item-border);}
.iconbtn.sm:active{background:var(--dropdown-item-pressed);}
.iconbtn.sm .icon{width:28px;height:28px;}
.iconbtn .icon{width:36px;height:36px;}
/* 未讀數徽章（Toolbar 通知）*/
.iconbtn{position:relative;}
.rail-badge{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;padding:0 5px;border-radius:var(--r-full);
  background:var(--error-strong);color:var(--white);font-size:16px;font-weight:700;
  /* 不加白色外框；用 flex 置中才不會被 line-height 推偏 */
  display:flex;align-items:center;justify-content:center;line-height:1;
  font-variant-numeric:tabular-nums;}
/* 電量狀態（PRD §2.3 — 低於 20% / 10% 需提示）*/
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:12px;align-items:center;}
.battery{width:60px;padding:6px 0 4px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--text);user-select:none;   /* 與側欄 icon 同色 */
  /* 原型模擬用：點擊切換電量斷點。正式版是純狀態顯示，不可點 */
  border:none;background:transparent;font-family:inherit;cursor:pointer;}
.battery:hover{outline:1px dashed var(--g4);outline-offset:-1px;}   /* 虛線＝模擬功能，與右上角開關同語彙 */
.battery:active{opacity:.6;}
.battery .bat-pct{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
/* 20% 與 10% 同樣用紅色警示（只換 icon 與文字色，不加底色）；
   兩段仍分開掛 class，因為通知文案不同（低於 20% / 低於 10%）*/
.battery.low,
.battery.crit{color:var(--error-strong);}

/* ═══ ChannelTabs ═══ */
.tabs{display:flex;gap:12px;align-items:center;}
.tab{background:var(--surface-alt);color:var(--text);border:2px solid var(--border);border-radius:var(--r-md);
  height:60px;padding:12px 20px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:400;
  user-select:none;transition:background .08s linear;flex-shrink:0;white-space:nowrap;}
.tab:active{background:var(--g2);}
.tab.active{background:var(--brand-primary);color:var(--white);border-color:transparent;font-weight:700;}
.tab .t-label{font-size:24px;font-weight:inherit;}
.tab .t-count{font-size:20px;font-weight:inherit;}

/* ═══ 原型模擬開關（非產品功能）═══
   有/無 CDS、前/後結 會改變 PRD 的流程與選單，用虛線框與產品 UI 區隔。 */
.simbar{margin-left:auto;display:flex;align-items:center;gap:14px;flex-shrink:0;
  border:1px dashed var(--g4);border-radius:var(--r-md);padding:8px 12px;}
.simbar .sim-tag{font-size:14px;font-weight:700;color:var(--text-sub);letter-spacing:1px;flex-shrink:0;}
.sim-group{display:flex;align-items:center;gap:8px;}
.sim-group .sim-label{font-size:16px;font-weight:700;color:var(--text-sub);white-space:nowrap;}
.sim-group .seg{padding:3px;gap:3px;}
.sim-group .seg button{font-size:16px;padding:5px 12px;white-space:nowrap;}

/* ═══ 危險操作（PRD §3.5 #4 — 置於選單最底，以分隔線與變色隔開）═══ */
.menu-sep{height:2px;background:var(--border);flex-shrink:0;margin:-8px -20px;}
.btn.danger{background:var(--error-light);color:var(--error-strong);border:2px solid var(--error-strong);}
.btn.danger:active{background:var(--error-strong);color:var(--white);}
.btn.danger:disabled{background:var(--surface-alt);color:var(--text-disable);border-color:transparent;}
.modal.confirm-dialog{width:420px;gap:12px;}
.confirm-body{font-size:20px;line-height:1.4;color:var(--text);}
.confirm-body .c-num{font-weight:700;}

/* ═══ 搜尋訂單 Dialog（PRD §2.3.1）═══ */
/* .modal 的 width 在後面定義，故提高一級選擇器權重 */
.modal.search-dialog{width:80vw;height:calc(100vh - 48px);max-width:none;max-height:none;overflow:hidden;}
/* 寬佔畫面 8 成；高度幾乎滿版（上下各留 24px），讓結果卡片露出越多越好 */
.dlg-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:0;
  flex:1 1 auto;min-height:0;
  /* 左右欄中間的分隔線要接上 header 分隔線、延伸到 Dialog 底緣 */
  margin:-16px 0 -20px;}
.dlg-cols > .dlg-left{padding:16px 20px 20px 0;border-right:2px solid var(--border);}
.dlg-cols > .dlg-right{padding:16px 20px 20px;margin-right:-20px;
  background:var(--page);}   /* #F5F8F9，撐到 Dialog 右緣與底緣（圓角由 Dialog overflow 裁切）*/
.dlg-left{display:flex;flex-direction:column;gap:12px;}
.dlg-actions{margin-top:auto;display:flex;gap:12px;}
.dlg-right{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow-y:auto;}
.dlg-right .card{flex:1 1 auto;min-height:0;}   /* 填滿右欄，與主畫面卡片等高 */
.dlg-hint{margin:auto;text-align:center;color:var(--text-sub);font-size:24px;line-height:1.4;padding:0 24px;}
.dlg-head-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.dlg-title{font-size:24px;font-weight:700;color:var(--text);}
.dlg-display{background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--r-md);
  padding:12px 16px;height:76px;flex-shrink:0;display:flex;align-items:center;font-size:32px;font-weight:700;
  color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:2px;overflow:hidden;}
/* 注意：修飾詞不可叫 .empty —— 會撞到主畫面空狀態的 .empty{margin:auto} */
.dlg-display.is-empty{color:var(--text-disable);font-size:20px;font-weight:400;letter-spacing:normal;}
.keypad{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;
  grid-auto-rows:minmax(0,1fr);flex:1 1 auto;min-height:280px;max-height:480px;}
.keypad .key{font-size:28px;min-width:0;}
.keypad .key.wide{grid-column:span 2;}
.key{border:1px solid var(--dropdown-item-border);border-radius:var(--r-md);
  background:var(--dropdown-item-bg);color:var(--text);font-size:32px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;user-select:none;}
.key:active{background:var(--dropdown-item-pressed);}
.key.label{font-size:20px;}
.btn.dlg-back{align-self:flex-start;flex-shrink:0;height:48px;padding:0 16px;font-size:20px;}
.dlg-found{color:var(--text-sub);font-size:20px;}
.dlg-empty{color:var(--text-sub);font-size:24px;text-align:center;padding:40px 0;}
.result-row{background:var(--surface);border:2px solid var(--border);border-radius:var(--r-md);padding:12px;
  display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;font-family:inherit;}
.result-row:active{background:var(--surface-alt);}
.result-num{font-size:24px;font-weight:700;color:var(--text);flex:1 0 0;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.result-state{font-size:20px;color:var(--text-sub);white-space:nowrap;flex-shrink:0;}
.tag-done{background:var(--surface-alt);color:var(--text-sub);font-size:20px;
  font-weight:700;padding:4px 8px;border-radius:var(--r-md);white-space:nowrap;}

/* ═══ Grid ═══ */
/* 設計稿：訂單區外距與卡片間距依版面密度 1×4 20px / 1×5 16px / 1×6 12px */
.grid{flex:1;padding:var(--grid-pad,20px);overflow:hidden;display:grid;gap:var(--grid-pad,20px);
  grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-template-rows:minmax(0,1fr);}
.empty{margin:auto;color:var(--text-sub);font-size:24px;font-weight:400;grid-column:1 / -1;}

/* 翻頁列（PRD §2.1 — 超出一屏以按鈕翻頁，不做橫向捲動）*/
.pager{flex-shrink:0;background:var(--surface);border-top:2px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:20px;}
.pager .page-num{font-size:24px;font-weight:700;color:var(--text);min-width:80px;text-align:center;
  font-variant-numeric:tabular-nums;}
/* 翻頁箭頭＝按了就執行的動作，用實心灰（同 .btn.gray）；與左側常駐工具列的外框線樣式區隔 */
.pager .iconbtn{background:var(--dropdown-item-bg);border-color:var(--dropdown-item-border);}
.pager .iconbtn:active{background:var(--dropdown-item-pressed);}
.pager .iconbtn:disabled{border-color:transparent;}   /* 停用同 .btn.gray:disabled：淺灰底、無外框 */
.iconbtn:disabled{background:var(--surface-alt);color:var(--text-disable);border-color:var(--border);cursor:not-allowed;}

/* ═══ OrderCard (Figma 32:210) ═══ */
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r-xl);
  display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.card.ready{border-color:var(--state-ready);}   /* PRD §3.1 — 待取餐改色 */
.card-head{border-bottom:2px solid var(--border);border-top-left-radius:14px;border-top-right-radius:14px;
  padding:12px;display:flex;flex-direction:column;gap:8px;}
.card-head-row{display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between;}
.card-title{display:flex;align-items:center;gap:8px;flex:1 0 0;min-width:0;}
.card-num{color:var(--text);font-size:var(--num-size,28px);font-weight:700;
  white-space:nowrap;overflow:hidden;flex:0 1 auto;min-width:0;}
/* 內容放不下時：先沿既有字級級距縮字，畫面保持靜止；
   縮到最小仍放不下才捲一次露出結尾，之後停住不再動。 */
.mq{overflow:hidden;min-width:0;}
.mq > .mq-track{display:inline-block;white-space:nowrap;}
.mq.marquee > .mq-track{
  animation:mqReveal var(--mq-dur,2s) ease-in-out 1.6s 1 forwards;
  will-change:transform;
}
@keyframes mqReveal{
  from {transform:translateX(0);}
  to   {transform:translateX(var(--mq-shift,0));}
}
@media (prefers-reduced-motion:reduce){
  .mq.marquee > .mq-track{animation:none;transform:translateX(var(--mq-shift,0));}
}
/* 空間不足時桌號先讓位，訂單編號（恆顯示）最後才截斷 */
.card-table{color:var(--text-sub);font-size:20px;font-weight:400;white-space:nowrap;
  flex:0 500 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.badges{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.paid-icon{color:#71717A;display:inline-flex;align-items:center;justify-content:center;}
/* 卡片資訊列：進單時間（左）＋ 預約取餐時間（右，預約單才有）*/
.card-meta{background:var(--meta-bg);border-radius:var(--r-md);padding:4px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;}
.card.ready .card-meta{background:var(--meta-ready-bg);}
.card-meta .m-time{display:inline-flex;align-items:center;gap:4px;color:var(--text);
  font-size:20px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap;}
.card-meta .m-sched{display:inline-flex;align-items:center;gap:4px;color:var(--text);
  font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  min-width:0;overflow:hidden;}
.card-meta .m-sched > .icon{flex-shrink:0;}
.card-meta .m-sched > .mq{flex:0 1 auto;}
.card-meta .m-time{flex-shrink:0;}
.card-items{flex:1 0 0;padding:12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;}
.card-foot{border-top:2px solid var(--border);border-bottom-left-radius:14px;border-bottom-right-radius:14px;
  padding:12px;display:flex;gap:10px;align-items:stretch;position:relative;}

/* ═══ ChannelTag ═══ */
.channel-tile{width:40px;height:40px;border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.channel-tile.icon-tile{background:var(--svc);color:#FFFFFF;}
.channel-tile.logo-tile{padding:3px 7px;overflow:hidden;}
.channel-tile.logo-tile svg{display:block;}

/* ═══ CustomerNote ═══ */
.note{background:var(--surface);border:2px solid var(--border);border-radius:var(--r-md);padding:12px;
  display:flex;gap:8px;align-items:flex-start;width:100%;}
.note-body{flex:1 0 0;min-width:0;color:var(--text);font-size:20px;font-weight:400;line-height:1.3;}
.note-toggle{background:transparent;border:none;padding:0;cursor:pointer;color:var(--text);display:inline-flex;flex-shrink:0;}

/* ═══ OrderItem (Figma 31:141) ═══ */
.item-wrap{position:relative;}
.item{background:var(--page);border:2px solid var(--border);border-radius:var(--r-md);padding:12px;
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  user-select:none;-webkit-user-select:none;}
.item.is-done{background:var(--surface-alt);text-decoration:line-through;text-decoration-color:var(--text-disable);}
.item.head{border-bottom-left-radius:0;border-bottom-right-radius:0;}
.item.tail{border-top-left-radius:0;border-top-right-radius:0;border-top-width:0;}
.item-bar{width:4px;align-self:stretch;background:var(--g4);border-radius:var(--r-full);flex-shrink:0;}
.item.is-done .item-bar{background:var(--g3);}
.item-main{display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:1 0 0;min-width:0;}
.item-row{display:flex;gap:8px;align-items:center;width:100%;}
.item-name{flex:1 1 auto;min-width:2.5em;color:var(--text);font-size:var(--item-fs,32px);font-weight:700;line-height:1.1;}
/* 加點標籤（品項層級）—— 外框線而非實心：這是標籤不是按鈕，實心品牌綠會跟「出餐」CTA 混淆。
   也不用紅色：紅色已指派給危險操作（PRD §5.3 一色一義）。*/
.item-addon{background:transparent;color:var(--brand-primary);border:2px solid var(--brand-primary);
  font-size:16px;font-weight:700;padding:0 6px;border-radius:var(--r-xs);
  white-space:nowrap;flex-shrink:0;line-height:1.5;}
.item.is-done .item-addon{color:var(--text-disable);border-color:var(--text-disable);}
.item-qty{color:var(--text);font-size:24px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.item.is-done .item-name,.item.is-done .item-qty{color:var(--text-disable);}
.item-notes{color:var(--text-sub);font-size:20px;font-weight:400;width:100%;line-height:1.3;}

.item-notes.item-attr{font-size:var(--attr-fs,24px);}
.item.is-done .item-notes{color:var(--text-disable);}

/* ═══ Checkbox (Figma 56:1531) ═══ */
.cbx{width:20px;height:20px;flex-shrink:0;border-radius:var(--r-xs);border:2px solid #71717A;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.cbx.checked{border:none;background:var(--brand-primary);color:var(--white);}
.cbx.checked.dim{background:var(--t-disable);}

/* ═══ Button (Figma 7:1286) ═══ */
.btn{border:none;padding:16px;border-radius:var(--r-md);font-size:24px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:12px;user-select:none;}
.btn.full{flex:1 0 0;}
.btn.brand{background:var(--cta-brand-bg);color:var(--white);}
.btn.brand:active{background:var(--cta-brand-pressed);}
.btn.blue{background:var(--info);color:var(--white);}
.btn.blue:active{background:var(--info-dark);}
.btn.gray{background:var(--dropdown-item-bg);color:var(--text);border:2px solid var(--dropdown-item-border);}
.btn.gray:active{background:var(--dropdown-item-pressed);}
.btn.square{flex-shrink:0;}
/* 樣式表：實心按鈕停用 —— 底色 #F4F4F5、文字 #D4D4D8、不加外框（灰／綠／藍／紅一致）*/
.btn:disabled{background:var(--surface-alt);color:var(--text-disable);border-color:transparent;cursor:not-allowed;}

/* ═══ DropdownMenu (Figma 56:2601) ═══ */
.menu{position:absolute;background:var(--surface);box-shadow:var(--menu-shadow);border:1px solid var(--menu-ring);
  border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:20px;width:240px;z-index:50;}
.menu.up{bottom:100%;left:0;margin-bottom:8px;}
.menu.down{top:calc(100% + 8px);left:0;}
.menu .btn{width:100%;}

/* ═══ Toast ═══ */
.toast-layer{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:12px;z-index:100;}
.toast{background:var(--toast-bg);color:var(--toast-fg);padding:14px 20px;border-radius:var(--r-md);
  box-shadow:var(--shadow4);font-size:20px;font-weight:700;min-width:200px;}

/* ═══ SettingsModal ═══ */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:80;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow4);width:460px;
  max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
.modal-title{font-size:24px;font-weight:700;color:var(--text);}
/* Dialog header／footer 分隔線：以負 margin 撐到 Dialog 左右邊緣，線條滿版 */
.modal > .dlg-head,
.modal > .modal-title{flex-shrink:0;margin:0 -20px;padding:0 20px 20px;border-bottom:2px solid var(--border);}
.modal > .modal-actions{flex-shrink:0;margin:0 -20px;padding:20px 20px 0;border-top:2px solid var(--border);}
.field{display:flex;flex-direction:column;gap:8px;font-size:20px;color:var(--text);}
.field > .f-label{font-weight:700;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:20px;color:var(--text);}
.row > .f-label{font-weight:700;}
.seg{display:flex;background:var(--surface-alt);border-radius:var(--r-md);padding:4px;gap:4px;}
.seg button{flex:1;padding:8px 12px;border:none;border-radius:var(--r-xs);background:transparent;color:var(--text);
  font-size:20px;font-weight:400;cursor:pointer;transition:background .12s,color .12s;}
.seg button.active{background:var(--brand-primary);color:var(--white);font-weight:700;}
.switch{width:48px;height:28px;border-radius:var(--r-full);border:none;background:var(--g2);position:relative;
  cursor:pointer;padding:0;transition:background .18s;flex-shrink:0;}
.switch.on{background:var(--brand-primary);}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--white);border-radius:var(--r-full);
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s ease-out;}
.switch.on i{left:23px;}
.modal-actions{display:flex;gap:12px;}
.modal-actions .btn{font-size:20px;padding:14px;}
.modal.reprint-dialog{width:360px;gap:12px;}
.reprint-opt{background:var(--page);border:2px solid var(--border);border-radius:var(--r-md);padding:16px;
  display:flex;align-items:center;gap:12px;width:100%;cursor:pointer;text-align:left;
  font-family:inherit;font-size:24px;font-weight:700;color:var(--text);}
.reprint-opt:active{background:var(--surface-alt);}
.reprint-opt.on{border-color:var(--brand-primary);}

/* ═══ 通知 Dialog（PRD §2.3 — 商店通知）═══ */
/* 高度與搜尋訂單 Dialog 一致（上下各留 24px），清單填滿中間、超出可捲動 */
.modal.notif-dialog{width:560px;gap:16px;height:calc(100vh - 48px);max-height:none;overflow:hidden;}
.notif-list{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow-y:auto;}
.notif-dialog .notif-empty{flex:1 1 auto;display:flex;align-items:center;justify-content:center;}
/* 清單式：不用卡片，每則之間以分隔線區隔；未讀靠左側圓點＋粗體辨識 */
.notif-item{background:transparent;border:none;border-bottom:2px solid var(--border);border-radius:0;padding:16px 4px;
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font-family:inherit;}
.notif-item:last-child{border-bottom:none;}
.notif-item.unread{cursor:pointer;}
.notif-item.unread:active{background:var(--surface-alt);}
.notif-dot{width:10px;height:10px;border-radius:var(--r-full);background:transparent;flex-shrink:0;margin-top:9px;}
.notif-item.unread .notif-dot{background:var(--brand-primary);}
.notif-body{flex:1 0 0;min-width:0;display:flex;flex-direction:column;gap:4px;}
.notif-time{font-size:20px;font-weight:400;color:var(--text-sub);font-variant-numeric:tabular-nums;}
.notif-text{font-size:24px;font-weight:700;color:var(--text);line-height:1.3;word-break:break-word;}
.notif-item.is-read .notif-text{font-weight:400;color:var(--text-sub);}
.notif-empty{color:var(--text-sub);font-size:20px;text-align:center;padding:40px 0;}

  // 外送（自送）／Uber Eats／foodpanda 一律顯示預約（預計取餐）時間；
  // 平台單實務上都帶時間，資料缺值時以進單 +30 分鐘補上，避免卡片沒有時間可顯示
  return raw.map(o => ({
    ...o,
    scheduledTime: o.scheduledTime || (isDeliveryType(o.type) ? o.startTime + 30 * MIN : undefined),
    items: expandQty(o.items, false),
  }));
}

// 數量 >1 展開成 N 列 qty 1，讓每一份可獨立追蹤
function expandQty(items, done) {
  return items.flatMap(it => {
    const n = Math.max(1, it.qty || 1);
    return Array.from({ length: n }, (_, i) => ({
      ...it,
      id: i === 0 ? it.id : `${it.id}_${i}`,
      qty: 1,
      done: !!done,
      seat: it.seat || '',
      attachedToPrev: !!it.attachedToPrev,
    }));
  });
}

}

/* ───────────────────────── utils/time ─────────────────────────
   PRD §2.2 — 進單時間 HH:MM，24 小時制。
   PRD §5.4 — 預約取餐時間，非當日需一併顯示日期。
   （延遲警示已依附錄 A 移除，故不再有計時色階）                    */
function pad2(n) { return String(n).padStart(2, '0'); }
function fmtClock(ts) {
  const d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtSchedule(ts) {
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return (sameDay ? '' : pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) + ' ') + fmtClock(ts);
}

/* ─────────────────── utils/speech（新進單語音提示）─────────────────── */
const synth = window.speechSynthesis;
function getVoice(lang) {
  if (!synth) return null;
  const voices = synth.getVoices();
  return voices.find(v => v.lang === lang) || voices.find(v => v.lang.startsWith('zh')) || null;
}
function speak(text, lang) {
  if (!synth) return;
  lang = lang || 'zh-TW';
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang; utt.rate = 0.95; utt.pitch = 1;
  const voice = getVoice(lang);
  if (voice) utt.voice = voice;
  synth.speak(utt);
}
function announceNewOrder(order, lang) {
  const table = order.tableNumber
    ? (lang === 'zh' ? `${order.tableNumber} 桌` : `Table ${order.tableNumber}`)
    : order.orderNumber;
  const itemSummary = order.items
    .map(i => (lang === 'zh' ? `${i.name} ${i.qty} 份` : `${i.name} x${i.qty}`))
    .join('、');
  speak(lang === 'zh' ? `新訂單，${table}，${itemSummary}` : `New order, ${table}, ${itemSummary}`,
        lang === 'zh' ? 'zh-TW' : 'en-US');
}

/* ───────────────────────── DOM helper ───────────────────────── */
function h(tag, props) {
  const el = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, child) {
  if (child == null || child === false) return;
  if (Array.isArray(child)) { child.forEach(c => append(el, c)); return; }
  el.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
}

// 先走完一輪未插電（放電），再走一輪充電中。20 ＝ 琥珀、10 ＝ 紅燈。
const BATTERY_STEPS = [
  { pct:100, charging:false }, { pct:74, charging:false }, { pct:49, charging:false },
  { pct:20,  charging:false }, { pct:10, charging:false },
  { pct:100, charging:true  }, { pct:74, charging:true  }, { pct:49, charging:true  },
  { pct:20,  charging:true  }, { pct:10, charging:true  },
];
let BATTERY_MANUAL = false;   // 手動切過之後就不讓系統電量蓋回去
let batteryAlerted = { low:false, crit:false };
function batteryPct() { return Math.round(BATTERY.level * 100); }

const RETENTION_MS = 6 * 60 * 60 * 1000;   // PRD §5.1 — 訂單留存 6 小時

/* ── 通知（PRD §2.3 — Toolbar「通知」＝商店通知）─────────────

function unreadCount() { return state.notifications.filter(n => !n.read).length; }

/* ── 電量提示（PRD §2.3 — 低於 20 / 10% 需提示）───────────── */
function checkBatteryAlert() {
  if (BATTERY.charging) { batteryAlerted = { low:false, crit:false }; return; }
  const pct = batteryPct();
  if (pct > BATTERY_LOW)  batteryAlerted.low  = false;
  if (pct > BATTERY_CRIT) batteryAlerted.crit = false;
  if (pct <= BATTERY_CRIT && !batteryAlerted.crit) {
    batteryAlerted.crit = true; batteryAlerted.low = true;
    pushNotification('batteryCritical');
  } else if (pct <= BATTERY_LOW && !batteryAlerted.low) {
    batteryAlerted.low = true;
    pushNotification('batteryLow');
  }
}
window.kdsSetBattery = (pct, charging) => {
  BATTERY_MANUAL = true;
  BATTERY.level = Math.max(0, Math.min(100, Number(pct) || 0)) / 100;
  if (charging != null) BATTERY.charging = !!charging;
  checkBatteryAlert();
  render();
  return batteryPct();
};

// 點電量塊 → 跳到下一個斷點（到底回頭）。
function cycleBattery() {
  const i = BATTERY_STEPS.findIndex(sp =>
    sp.pct === batteryPct() && sp.charging === BATTERY.charging);
  const next = BATTERY_STEPS[(i + 1) % BATTERY_STEPS.length];   // 找不到時 i = -1 → 從頭開始
  window.kdsSetBattery(next.pct, next.charging);
}
if (!BATTERY_PARAM && navigator.getBattery) {
  navigator.getBattery().then(b => {
    const sync = () => {
      if (BATTERY_MANUAL) return;              // 手動模擬中，不讓系統電量蓋回去
      BATTERY.level = b.level; BATTERY.charging = b.charging;
      checkBatteryAlert(); render();
    };
    b.addEventListener('levelchange', sync);
    b.addEventListener('chargingchange', sync);
    sync();
  }).catch(() => {});
}

/* ── 回上一步（PRD §2.3 / §3.3）─────────────────────────────
   動作層級的復原堆疊，最多 5 步，涵蓋品項標記、出餐、消單。       */
function snapshot() {
  return {
    orders: JSON.parse(JSON.stringify(state.orders)),
    history: JSON.parse(JSON.stringify(state.history)),
  };
}
function pushUndo() {
  state.undo.push(snapshot());
  if (state.undo.length > UNDO_LIMIT) state.undo.shift();
}
// PRD §3.4 — 退單不可由廚房復原。
// 因為復原點存的是整份訂單狀態的快照，光是「不記錄新的復原點」不夠：
// 按「回上一步」回到退單前的舊快照，一樣會把已退單的訂單救回來。
// 所以退單時把該筆訂單從所有既有復原點裡抽掉，其他訂單的復原仍然可用。
function dropFromUndo(orderId) {
  state.undo.forEach(snap => {
    snap.orders = snap.orders.filter(o => o.id !== orderId);
    snap.history = snap.history.filter(o => o.id !== orderId);
  });
}
function handleUndo() {
  if (!state.undo.length) { pushToast(t(state.lang, 'toastNoUndo')); return; }
  const snap = state.undo.pop();
  state.orders = snap.orders;
  state.history = snap.history;
  // 復原不是新進單，不觸發新單提示
  knownOrderIds = new Set(state.orders.map(o => o.id));
  pushToast(t(state.lang, 'toastUndone'));
  render();
}

/* ── 品項單點標記（PRD §3.3）────────────────────────────────
   單向推進：未做 → 完成。已完成不可取消，誤點用「回上一步」。     */
function handleItemDone(orderId, ids) {
  const order = findOrder(orderId);
  if (!order) return;
  const key = orderId + '::' + ids[0];
  const now = Date.now();
  if (itemLock[key] && now - itemLock[key] < TAP_LOCK_MS) return;  // §3.5 #1 連點鎖定
  const targets = order.items.filter(i => ids.indexOf(i.id) !== -1 && !i.done);
  if (!targets.length) return;                                     // 單向推進
  itemLock[key] = now;
  pushUndo();
  targets.forEach(i => { i.done = true; });
  render();
}

/* ── 消單：從畫面移除，轉入訂單查詢（保留 6 小時）── */
function closeOrder(orderId) {
  const card = document.querySelector('.card[data-oid="' + orderId + '"]');
  if (card) card.classList.add('v2-fade-out');
  setTimeout(() => {
    const order = findOrder(orderId);
    if (!order) return;
    state.history = state.history.filter(o => o.id !== order.id)
      .concat([{ ...order, completedAt: Date.now(), items: order.items.map(i => ({ ...i })) }]);
    state.orders = state.orders.filter(o => o.id !== orderId);
    render();
  }, 350);
}

/* ── 出餐（PRD §3.1 / §3.2）────────────────────────────────
   永遠可按，不因品項狀態 disable，也不改變品項標記。
   有 CDS：製作中 →〔出餐＋自動叫號〕→ 待取餐 →〔已取餐〕→ 消單
   無 CDS：製作中 →〔出餐〕→ 直接消單                            */
function handleServe(orderId) {
  const order = findOrder(orderId);
  if (!order || order.called) return;
  pushUndo();
  if (HAS_CDS) {
    order.called = true;
    pushToast(`${t(state.lang, 'toastServedCalled')} ${order.orderNumber}`);
    render();
  } else {
    pushToast(`${t(state.lang, 'toastServed')} ${order.orderNumber}`);
    closeOrder(orderId);
  }
}

/* ── 已取餐 → 消單（僅有 CDS 時出現）── */
function handlePickup(orderId) {
  const order = findOrder(orderId);
  if (!order) return;
  pushUndo();
  pushToast(`${t(state.lang, 'toastPickedUp')} ${order.orderNumber}`);
  closeOrder(orderId);
}

/* ── 「⋯」訂單選單（PRD §3.4）── */
function handleAction(action, order) {
  state.menuOpen = null;
  // PRD §3.4 / §3.5 — 退單是不可逆操作，二次確認只保留此處與後結內用刪除品項
  if (action === 'refund') {
    state.refund = { open:true, orderId:order.id };
    render();
    return;
  }
  if (action === 'reprint') {
    // PRD §3.4 — 補印需先以 Dialog 選擇「廚房單／標籤貼紙」
    state.reprint = { open:true, orderId:order.id, kitchen:false, sticker:false };
    render();
    return;
  }
  pushToast(`${t(state.lang, 'toastCalled')} ${order.orderNumber}`);
  render();
}

// PRD §3.4 — 補印可同時選廚房單與標籤貼紙（複選）
function doReprint() {
  const rp = state.reprint;
  const kinds = [];
  if (rp.kitchen) kinds.push(t(state.lang, 'reprintKitchen'));
  if (rp.sticker) kinds.push(t(state.lang, 'reprintSticker'));
  if (!kinds.length) return;
  const order = state.orders.concat(state.history).find(o => o.id === rp.orderId);
  state.reprint = { open:false, orderId:null, kitchen:false, sticker:false };
  if (order) {
    const sep = state.lang === 'zh' ? '、' : ' + ';
    pushToast(`${t(state.lang, 'toastReprinted')}${kinds.join(sep)} ${order.orderNumber}`);
  }
  render();
}

// PRD §3.4 — 退單（後結限定）：二次確認後消單，轉入訂單查詢
function doRefund() {
  const id = state.refund.orderId;
  state.refund = { open:false, orderId:null };
  const order = findOrder(id);
  if (!order) { render(); return; }
  order.refunded = true;   // 併入 history 的副本會帶著這個旗標，搜尋時顯示「已退單」
  dropFromUndo(id);        // 不記錄復原點，且既有復原點不得救回這筆訂單
  pushToast(`${t(state.lang, 'toastRefunded')} ${order.orderNumber}`);
  render();          // 先收掉確認框
  closeOrder(id);    // 再播卡片淡出
}

function handleRefresh() {
  state.orders = cloneInitial();
  state.history = cloneHistory();
  state.undo = [];
  knownOrderIds = new Set(state.orders.map(o => o.id));
  pushToast(t(state.lang, 'toastRefreshed'));
  render();
}

/* 逾 6 小時的已消單訂單自動清除（PRD §5.1 / §2.3.1）*/
function pruneHistory() {
  const cutoff = Date.now() - RETENTION_MS;
  const kept = state.history.filter(o => (o.completedAt || 0) >= cutoff);
  if (kept.length === state.history.length) return false;
  state.history = kept;
  return true;
}

/* ───────────────────────── Derived ───────────────────────── */
function channelCounts() {
  const counts = { all: state.orders.length, 'dine-in':0, takeout:0, delivery:0, ubereats:0, foodpanda:0 };
  state.orders.forEach(o => { if (counts[o.type] !== undefined) counts[o.type] += 1; });
  return counts;
}

// PRD §2.3.1 — 準確搜尋：訂單編號或電話號碼完全相符。
function matchOrder(o, q) {
  const norm = (v) => String(v || '').replace(/[#\s-]/g, '').toLowerCase();
  const digits = (v) => String(v || '').replace(/\D/g, '');
  const qn = norm(q);
  if (!qn) return true;
  return norm(o.orderNumber) === qn
      // 只記得單號數字部分時也能找到（例：輸入 0984 找到 #0984-jxkr）
      || (/^\d+$/.test(qn) && digits(o.orderNumber) === qn)
      || digits(o.customer && o.customer.phone) === digits(q);
}

// PRD §4 — 訂單排序依裝置設定（時間正序／倒序）。
function sortOrders(list) {
  const dir = state.settings.sort === 'desc' ? -1 : 1;
  return list.slice().sort((a, b) => (a.startTime - b.startTime) * dir);
}

function visibleOrders() {
  const list = state.channel === 'all'
    ? state.orders
    : state.orders.filter(o => o.type === state.channel);
  return sortOrders(list);
}

/* PRD §2.3.1 — 準確搜尋，範圍＝畫面上未消單的訂單 ＋ 已消單 6 小時內，
   不受服務類型篩選影響。訂單編號或電話號碼皆可。                        */
function searchPool() {
  const cutoff = Date.now() - RETENTION_MS;
  return state.orders.concat(state.history.filter(o => (o.completedAt || 0) >= cutoff));
}
function runSearch() {
  const q = state.search.query.trim();
  if (!q) return;
  const hits = searchPool().filter(o => matchOrder(o, q));
  state.search.results = hits;
  state.search.selected = hits.length === 1 ? hits[0].id : null;
  bumpSearchIdle();
  render();
}
function orderStateKey(order) {
  // PRD §3.4 — 退單的訂單同樣是已消單，但狀態要顯示「已退單」以區別正常完成
  if (order.completedAt) return order.refunded ? 'stateRefunded' : 'stateDone';
  return order.called ? 'stateReady' : 'stateCooking';
}

// 依 attachedToPrev 切群組：長度 1 ＝ 獨立品項，長度 >1 ＝ 套餐（主品項＋附屬品項）
// PRD §1.5 — 加點屬「後結內用」情境（僅 POS 內用有此情境）。
// 前結或非內用單：不顯示加點標籤，也不做置頂，品項一律照原順序。
function showsAddon(order) { return POSTPAY_DINEIN && order.type === 'dine-in'; }

function mergeKey(it, addonOn) {
  // 加點與原單的同一品項不可合併 —— 兩者是不同時間點的需求。
  // 不呈現加點時（前結）就不該用它切開，否則會出現兩列看起來完全相同的品項。
  // seat 已不顯示，同理不納入 key。
  return `${it.name}::${attrLines(it).join('|')}::${it.memo || ''}::${addonOn && it.addon ? 1 : 0}`;
}
// 加點品項置頂（穩定排序，加點之間與原單之間各自維持原順序）
function addonFirst(list, addonOn) {
  if (!addonOn) return list;
  const add = list.filter(g => g[0].addon);
  return add.length ? add.concat(list.filter(g => !g[0].addon)) : list;
}

function buildGroups(order, merge) {
  const addonOn = showsAddon(order);
  const groups = [];
  for (const it of order.items) {
    if (it.attachedToPrev && groups.length) groups[groups.length - 1].push(it);
    else groups.push([it]);
  }
  if (!merge) return addonFirst(groups, addonOn);

  // PRD §1.5 — 同一張訂單內「品項＋屬性完全相同」的多筆合併為一列、數量加總。
  // 套餐（帶附屬品項）不參與合併；合併結果留在第一次出現的位置。
  const at = new Map();
  const out = [];
  for (const g of groups) {
    if (g.length > 1) { out.push(g); continue; }
    const it = g[0];
    const key = mergeKey(it, addonOn);
    if (at.has(key)) {
      const cur = out[at.get(key)][0];
      cur.qty += it.qty;
      cur.done = cur.done && it.done;        // 全部完成才算完成
      cur._members.push(it.id);
    } else {
      at.set(key, out.length);
      out.push([{ ...it, _members: [it.id] }]);
    }
  }
  return addonFirst(out, addonOn);
}

function renderCustomerNote(order) {

/* ── 點擊判定（PRD §3.5 #5）────────────────────────────────
   卡片內垂直捲動時，手指移動超過 10px 即判為捲動，放開不觸發點擊。
   PRD §3.3：長按選單第一階段不做，故不再綁長按。                  */
function attachTap(el, onTap) {
  let sx = 0, sy = 0, moved = false, down = false;
  const pt = (e) => (e.touches && e.touches[0]) || e;
  const start = (e) => { const p = pt(e); sx = p.clientX; sy = p.clientY; moved = false; down = true; };
  const move = (e) => {
    if (!down) return;
    const p = pt(e);
    if (Math.abs(p.clientX - sx) > SCROLL_SLOP || Math.abs(p.clientY - sy) > SCROLL_SLOP) moved = true;
  };
  const end = () => { down = false; };
  el.addEventListener('mousedown', start);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', end);
  el.addEventListener('touchstart', start, { passive:true });
  el.addEventListener('touchmove', move, { passive:true });
  el.addEventListener('touchend', end, { passive:true });
  el.addEventListener('touchcancel', end, { passive:true });
  el.addEventListener('click', () => { if (moved) { moved = false; return; } onTap(); });
}

// 屬性正規化：字串 → 單行；陣列 → 多行

}

      class:'card' + (seenCardIds.has(order.id) ? '' : ' v2-slide-in'),
      'data-oid':order.id,
    },
    /* Header */
    h('div', { class:'card-head' },
      h('div', { class:'card-head-row' },
        h('div', { class:'card-title' },
          renderChannelTag(order.type),
          h('span', { class:'card-num mq' },
            h('span', { class:'mq-track', text:order.orderNumber })),
          order.type === 'dine-in' && order.tableNumber
            ? h('span', { class:'card-table', text:order.tableNumber + (state.lang === 'zh' ? '桌' : '') })
            : null),
        h('div', { class:'badges' },
          // PRD §2.3.1 — 已消單的訂單於卡片上加狀態標示（已完成／已退單）
          (inSearch && closed) ? h('span', { class:'tag-done', text:t(state.lang, orderStateKey(order)) }) : null,
          paid ? h('span', { class:'paid-icon', title:t(state.lang, 'paid') }, icon('circleDollarSign', 32)) : null)),
      // PRD §2.2 — 進單時間 HH:MM 恆顯示；預約單一併顯示預約取餐日期／時間
      h('div', { class:'card-meta' },
        h('span', { class:'m-time' }, icon('clock', 20), fmtClock(order.startTime)),
        order.scheduledTime
          // 設計稿：日曆 icon 已表達「預約」，不再重複顯示文字標籤
          ? h('span', { class:'m-sched', title:t(state.lang, 'scheduled') },
              icon('calendar', 20),
              h('span', { class:'mq' },
                h('span', { class:'mq-track', text:fmtSchedule(order.scheduledTime) })))
          : null)),

    /* Item list */
    h('div', { class:'card-items' },
      renderCustomerNote(order),
      groups.map((g, gi) => {
        if (g.length === 1) return renderOrderItem(order, g[0], 'single', itemOpts);
        return h('div', { style:'display:flex;flex-direction:column' },
          g.map((it, idx) => renderOrderItem(order, it, idx === 0 ? 'head' : 'tail', itemOpts)));
      })),

    /* Footer */
    h('div', { class:'card-foot' },
      // PRD §2.3.1 — 搜尋結果卡片除底部 CTA 外全部不可操作，「⋯」選單停用
      h('button', { class:'btn gray square', 'aria-label':'actions', disabled: inSearch,
        onclick: inSearch ? null
          : () => { state.menuOpen = state.menuOpen === order.id ? null : order.id; render(); } },
        icon('ellipsisV', 24)),
      (!inSearch && state.menuOpen === order.id) ? renderDropdownMenu(order) : null,
      // PRD §3.2 — CTA 永遠可按，不因品項狀態 disable
      // PRD §5.1.6 — 搜尋結果：製作中→出餐、待取餐→已取餐、已完成→停用
      h('button', {
        class:'btn full ' + (closed ? 'gray' : ready ? 'blue' : 'brand'),
        text:t(state.lang, closed ? orderStateKey(order) : ready ? 'pickedUp' : 'serve'),
        disabled: closed,
        onclick: closed ? null : () => {
          if (inSearch) closeSearch();
          if (ready) handlePickup(order.id); else handleServe(order.id);
        },
      })));

  seenCardIds.add(order.id);
  return card;
}

/* ── SettingsModal bits ── */
function segControl(options, value, onChange) {
  return h('div', { class:'seg' },
    options.map(opt => h('button', {
      class: opt.value === value ? 'active' : '',
      text: opt.label,
      onclick: () => onChange(opt.value),
    })));
}
function toggleSwitch(checked, onChange) {
  return h('button', {
    class:'switch' + (checked ? ' on' : ''), role:'switch', 'aria-checked':String(checked),
    onclick:() => onChange(!checked),
  }, h('i'));
}
function renderSettingsModal() {
  if (!state.settingsOpen || !state.draft) return null;
  const s = state.draft.settings;
  const lang = state.draft.lang;      // 設定頁自身即時反映草稿語言
  const field = (label, control) =>
    h('label', { class:'field' }, h('span', { class:'f-label', text:label }), control);
  const row = (label, control) =>
    h('div', { class:'row' }, h('span', { class:'f-label', text:label }), control);

  return h('div', { class:'modal-overlay', onclick: cancelSettings },
    h('div', { class:'modal', onclick:(e) => e.stopPropagation() },
      dialogHead(t(lang, 'settingsTitle'), cancelSettings),

      // PRD 設定項清單與順序：版面密度 → 品項字體大小 → 訂單排序 →
      // 訂單資訊顯示 → 合併相同品項 → 通知提示 → 啟用商店 → 軟體更新。
      // 語言、主題、顯示已完成品項不在清單內，已移除（demo 可用 ?lang=en / ?theme=dark）。
      field(t(lang, 'densityLabel'), segControl(
        [{ value:4, label:'1×4' }, { value:5, label:'1×5' }, { value:6, label:'1×6' }],
        s.density, v => setSetting('density', v))),

      field(t(lang, 'fontScale'), segControl(
        [{ value:'s', label:t(lang, 'sizeSmall') },
         { value:'m', label:t(lang, 'sizeMedium') },
         { value:'l', label:t(lang, 'sizeLarge') }],
        s.itemFontSize, v => setSetting('itemFontSize', v))),

      field(t(lang, 'sortLabel'), segControl(
        [{ value:'asc',  label:t(lang, 'sortAsc') },
         { value:'desc', label:t(lang, 'sortDesc') }],
        s.sort, v => setSetting('sort', v))),

      row(t(lang, 'showOrderInfo'),
        toggleSwitch(!!s.showOrderInfo, v => setSetting('showOrderInfo', v))),

      row(t(lang, 'mergeItems'),
        toggleSwitch(!!s.mergeItems, v => setSetting('mergeItems', v))),

      row(t(lang, 'notifyNewOrder'),
        toggleSwitch(!!s.notify, v => setSetting('notify', v))),

      // PRD 另有「啟用商店」「軟體更新」兩項，顯示規格待與 PM 確認後再加回

      // PRD §4 — 點「確認」才儲存
      h('div', { class:'modal-actions' },
        h('button', { class:'btn gray', style:'flex:1', text:t(lang, 'close'), onclick: cancelSettings }),
        h('button', { class:'btn brand', style:'flex:1', text:t(lang, 'confirm'), onclick: commitSettings }))));
}

/* ── 補印 Dialog（PRD §3.4）── */
function renderReprintDialog() {
  const rp = state.reprint;
  if (!rp.open) return null;
  const close = () => { state.reprint = { open:false, orderId:null, kitchen:false, sticker:false }; render(); };
  const opt = (key, labelKey) => {
    const on = !!rp[key];
    const toggle = () => { rp[key] = !rp[key]; render(); };
    return h('button', { class:'reprint-opt' + (on ? ' on' : ''), onclick: toggle },
      renderCheckbox(on, false, toggle),
      h('span', { text:t(state.lang, labelKey) }));
  };
  return h('div', { class:'modal-overlay', onclick: close },
    h('div', { class:'modal reprint-dialog', onclick:(e) => e.stopPropagation() },
      h('div', { class:'modal-title', text:t(state.lang, 'reprintTitle') }),
      opt('kitchen', 'reprintKitchen'),
      opt('sticker', 'reprintSticker'),
      h('div', { class:'modal-actions' },
        h('button', { class:'btn gray', style:'flex:1', text:t(state.lang, 'cancel'), onclick: close }),
        h('button', { class:'btn brand', style:'flex:1', text:t(state.lang, 'confirm'),
          disabled: !rp.kitchen && !rp.sticker, onclick: doReprint }))));
}

/* ── 退單二次確認（PRD §3.4「需二次確認」／§3.5「二次確認只保留兩處」）── */
function renderRefundDialog() {
  const rf = state.refund;
  if (!rf.open) return null;
  const lang = state.lang;
  const order = findOrder(rf.orderId);
  const close = () => { state.refund = { open:false, orderId:null }; render(); };

  return h('div', { class:'modal-overlay', onclick: close },
    h('div', { class:'modal confirm-dialog', onclick:(e) => e.stopPropagation() },
      h('div', { class:'modal-title', text:t(lang, 'refundTitle') }),
      h('div', { class:'confirm-body' },
        t(lang, 'refundDescPre'),
        order ? h('span', { class:'c-num', text:order.orderNumber }) : null,
        t(lang, 'refundDescPost')),
      h('div', { class:'modal-actions' },
        h('button', { class:'btn gray', style:'flex:1', text:t(lang, 'cancel'), onclick: close }),
        h('button', { class:'btn danger', style:'flex:1', text:t(lang, 'actionRefund'),
          onclick: doRefund }))));
}

/* ── 通知 Dialog（PRD §2.3）──────────────────────────────────
   標題「通知」；內容條列 通知時間 ＋ 事件內容；
   左下「關閉」、右下「全部已讀」（無未讀時 disable）。            */
function renderNotifyDialog() {
  if (!state.notifOpen) return null;
  const lang = state.lang;
  const list = state.notifications;
  const unread = unreadCount();

  return h('div', { class:'modal-overlay', onclick: closeNotify },
    h('div', { class:'modal notif-dialog', onclick:(e) => e.stopPropagation() },
      dialogHead(t(lang, 'notifyTitle'), closeNotify),
      list.length
        ? h('div', { class:'notif-list' },
            list.map(n => h(n.read ? 'div' : 'button',
              n.read
                ? { class:'notif-item is-read' }
                : { class:'notif-item unread', onclick:() => markRead(n.id) },
              h('span', { class:'notif-dot', 'aria-hidden':'true' }),
              h('div', { class:'notif-body' },
                h('div', { class:'notif-time', text:fmtSchedule(n.time) }),
                h('div', { class:'notif-text', text:(n[lang] || n.zh) })))))
        : h('div', { class:'notif-empty', text:t(lang, 'noNotifications') }),
      h('div', { class:'modal-actions' },
        h('button', { class:'btn gray', style:'flex:1', text:t(lang, 'close'), onclick: closeNotify }),
        h('button', { class:'btn brand', style:'flex:1', text:t(lang, 'markAllRead'),
          disabled: !unread, onclick: markAllRead }))));
}

/* ── Grid + 翻頁（PRD §2.1）──────────────────────────────────
   版面固定單列，每屏 N 張（版面密度 1×4 / 1×5 / 1×6）。
   超出一屏改以按鈕翻頁，不做橫向捲動。                            */
function currentList() { return visibleOrders(); }
function pageSize() {
  const d = state.settings.density;
  return (d === 5 || d === 6) ? d : 4;
}
function pageCount(list) {
  return Math.max(1, Math.ceil(list.length / pageSize()));
}

function renderGrid() {
  const cols = pageSize();
  // 設計稿：訂單編號 28px；訂單區外距／卡片間距依密度 1×4 20 / 1×5 16 / 1×6 12
  const GRID_PAD = { 4:'20px', 5:'16px', 6:'12px' };
  const grid = h('div', { class:'grid',
    style:'--cols:' + cols + ';--num-size:28px;--grid-pad:' + (GRID_PAD[cols] || '20px') });
  const list = currentList();

  if (!list.length) {
    append(grid, h('div', { class:'empty', text:t(state.lang, 'noOrders') }));
    return grid;
  }
  const start = state.page * cols;
  list.slice(start, start + cols).forEach(order => append(grid, renderOrderCard(order)));
  return grid;
}

function renderPager() {
  const list = currentList();
  const pages = pageCount(list);
  if (pages <= 1) return null;                 // 未超出一屏就不出現
  const go = (d) => { state.page = Math.min(pages - 1, Math.max(0, state.page + d)); render(); };
  return h('div', { class:'pager' },
    h('button', { class:'iconbtn', title:t(state.lang, 'prevPage'),
      disabled: state.page === 0, onclick:() => go(-1) }, icon('chevronLeft', 36)),
    h('span', { class:'page-num', text:(state.page + 1) + ' / ' + pages }),
    h('button', { class:'iconbtn', title:t(state.lang, 'nextPage'),
      disabled: state.page >= pages - 1, onclick:() => go(1) }, icon('chevronRight', 36)));
}

/* ── 搜尋訂單 Dialog（PRD §2.3.1）────────────────────────────
   以檢視為主，唯一可執行的動作是卡片底部 CTA。
   關閉：「關閉」鈕或無操作 60 秒；點遮罩不關閉，避免誤觸。        */
let searchIdleTimer = null;
function bumpSearchIdle() {
  clearTimeout(searchIdleTimer);
  if (!state.search.open) return;
  searchIdleTimer = setTimeout(() => { closeSearch(); render(); }, 60 * 1000);
}
function openSearch() {
  state.search = { open:true, query:'', results:null, selected:null };
  state.menuOpen = null;
  bumpSearchIdle();
  render();
}
function closeSearch() {
  clearTimeout(searchIdleTimer);
  state.search.open = false;
}
function keyPress(k) {
  const sc = state.search;
  if (k === 'back') sc.query = sc.query.slice(0, -1);
  else if (k === 'clear') sc.query = '';
  else if (sc.query.length < 16) sc.query += k;
  bumpSearchIdle();
  render();
}

/* Dialog 標題列：左標題、右上 [X] 關閉（額外操作放 X 左側）*/
function dialogHead(titleText, onClose, extra) {
  const label = t(state.lang, 'close');
  return h('div', { class:'dlg-head' },
    h('span', { class:'dlg-title', text:titleText }),
    h('div', { class:'dlg-head-actions' },
      extra || null,
      h('button', { class:'iconbtn sm', title:label, 'aria-label':label, onclick:onClose },
        icon('x', 28))));
}

function renderSearchDialog() {
  const sc = state.search;
  if (!sc.open) return null;
  return h('div', { class:'modal-overlay' },          // 無 onclick → 點遮罩不關閉
    h('div', { class:'modal search-dialog' },
      dialogHead(t(state.lang, 'searchTitle'), () => { closeSearch(); render(); }),
      h('div', { class:'dlg-cols' },
        h('div', { class:'dlg-left' }, renderSearchInput()),
        h('div', { class:'dlg-right' }, renderSearchResult()))));
}

/* 左欄：大按鍵英數鍵盤 —— 常駐，重新搜尋不必先返回 */
function renderSearchInput() {
  const sc = state.search;
  return [
    h('div', { class:'dlg-display' + (sc.query ? '' : ' is-empty'),
      text: sc.query || t(state.lang, 'searchHint') }),
    h('div', { class:'keypad' },
      // 平台單號含英文與「-」（例：#0984-JXKR），故用英數鍵盤；字母一律大寫顯示
      '1234567890QWERTYUIOPASDFGHJKL-'.split('').map(k =>
        h('button', { class:'key', text:k, onclick:() => keyPress(k) })),
      h('button', { class:'key label wide', text:t(state.lang, 'keyClear'), onclick:() => keyPress('clear') }),
      'ZXCVBNM'.split('').map(k =>
        h('button', { class:'key', text:k, onclick:() => keyPress(k) })),
      h('button', { class:'key', 'aria-label':'backspace', onclick:() => keyPress('back') },
        icon('backspace', 28))),
    // 離開類按鈕一律在左下角，主要動作在右下角（同設定／補印／通知 Dialog）
    h('div', { class:'dlg-actions' },
      h('button', { class:'btn gray', style:'flex:1', text:t(state.lang, 'close'),
        onclick:() => { closeSearch(); render(); } }),
      h('button', { class:'btn brand', style:'flex:1', text:t(state.lang, 'keySearch'),
        disabled: !sc.query, onclick: runSearch })),
  ];
}

/* 右欄：結果（尚未搜尋／查無訂單／單筆卡片／多筆清單）*/
function renderSearchResult() {
  const sc = state.search;
  if (sc.results === null) {
    return h('div', { class:'dlg-hint', text:t(state.lang, 'searchIdle') });
  }
  if (!sc.results.length) {
    return h('div', { class:'dlg-hint', text:t(state.lang, 'noResult') });
  }
  const selected = sc.selected && sc.results.find(o => o.id === sc.selected);
  if (selected) {
    // 多筆結果點進單筆時，「返回清單」放在卡片左上方、與卡片左緣對齊
    return [
      sc.results.length > 1
        ? h('button', { class:'btn gray dlg-back',
            onclick:() => { sc.selected = null; bumpSearchIdle(); render(); } },
            icon('chevronLeft', 20), t(state.lang, 'backToList'))
        : null,
      renderOrderCard(selected, { search:true }),
    ];
  }
  return [
    h('div', { class:'dlg-found', text:t(state.lang, 'foundN').replace('{n}', sc.results.length) }),
    sc.results.map(o => h('button', { class:'result-row',
        onclick:() => { sc.selected = o.id; bumpSearchIdle(); render(); } },
      renderChannelTag(o.type),
      h('span', { class:'result-num', text:o.orderNumber }),
      h('span', { class:'result-state', text:t(state.lang, orderStateKey(o)) }))),
  ];
}

function renderApp() {
  return h('div', { class:'app' },
    renderTopBar(),
    h('div', { class:'body-row' },
      renderSideRail(),
      h('div', { class:'content' },
        renderGrid(),
        renderPager())),
    renderSearchDialog(),
    renderNotifyDialog(),
    renderReprintDialog(),
    renderRefundDialog(),
    renderSettingsModal());
}

/* ═══════════════════════════════════════════════════════════════
   Render loop
   ═══════════════════════════════════════════════════════════════ */
const appRoot = document.getElementById('app');

function render() {
  // Preserve keyboard focus + caret across the full re-render
  const active = document.activeElement;
  const fkey = active && active.dataset ? active.dataset.fkey : null;
  const caret = (fkey && 'selectionStart' in active) ? active.selectionStart : null;

  document.documentElement.setAttribute('data-theme', state.settings.theme);
  const fsz = ITEM_FONT_SIZE[state.settings.itemFontSize] || ITEM_FONT_SIZE.m;
  document.documentElement.style.setProperty('--item-fs', fsz.item + 'px');
  document.documentElement.style.setProperty('--attr-fs', fsz.attr + 'px');
  state.page = Math.min(state.page, pageCount(currentList()) - 1);
  if (state.page < 0) state.page = 0;

  appRoot.textContent = '';
  appRoot.appendChild(renderApp());

  // 內容放不下時的處理（PRD §2.2「顯示長度上限與截斷規則」未給值）：
  //   1. 先沿既有字級級距（32/24/20/16）往下縮，縮得下就完全不動
  //   2. 縮到最小仍放不下，才捲一次露出結尾並停住
  const MQ_SPEED = 50;                 // px / 秒
  const STEPS_NUM = [28, 24, 20, 16];  // 訂單編號可用字級（設計稿基準 28px）
  const STEPS_SUB = [20, 16];          // 預約時間等次要資訊

  appRoot.querySelectorAll('.mq').forEach(el => {
    const track = el.firstElementChild;
    if (!track) return;
    if (track.offsetWidth - el.clientWidth <= 1) return;   // 放得下，什麼都不做

    // 1. 縮字級
    const steps = el.classList.contains('card-num') ? STEPS_NUM : STEPS_SUB;
    const curPx = parseFloat(getComputedStyle(el).fontSize);
    const target = curPx * (el.clientWidth / track.offsetWidth);
    const fits = steps.filter(v => v <= target);
    const chosen = fits.length ? Math.max(...fits) : Math.min(...steps);
    if (chosen < curPx) el.style.fontSize = chosen + 'px';

    // 2. 還是放不下才捲一次
    const over = track.offsetWidth - el.clientWidth;
    if (over <= 1) return;
    el.classList.add('marquee');
    el.style.setProperty('--mq-shift', (-over - 2) + 'px');
    el.style.setProperty('--mq-dur', Math.max(1.2, over / MQ_SPEED).toFixed(1) + 's');
  });

  // Drop slide-in memory for cards that left the list
  const live = new Set(state.orders.concat(state.history).map(o => o.id));
  seenCardIds.forEach(id => { if (!live.has(id)) seenCardIds.delete(id); });

  if (fkey) {
    const next = appRoot.querySelector('[data-fkey="' + fkey + '"]');
    if (next) {
      next.focus();
      if (caret != null) { try { next.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }

  announceNew();
}

// 新進單語音提示 —— 由裝置設定「通知提示開關」控制（PRD §4，預設關）
function announceNew() {
  if (state.settings.notify) {
    state.orders.forEach(order => {
      if (!knownOrderIds.has(order.id)) announceNewOrder(order, state.lang);
    });
  }
  knownOrderIds = new Set(state.orders.map(o => o.id));
}

/* 視窗尺寸改變 → 重算版面與卡片高度 */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

/* 已消單訂單逾 6 小時自動清除（PRD §5.1）*/
setInterval(() => { if (pruneHistory()) render(); }, 60 * 1000);

/* PRD §2.1 — App 寫死「保持螢幕喚醒」，不另做開關設定 */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* 非 https / 不支援時略過 */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});
keepAwake();

/* Outside-click / Escape closing for the kebab menu.
   The open panel is removed directly (no full re-render) so the button that
   was clicked survives to receive its own click — same sequence as React. */
document.addEventListener('mousedown', (e) => {
  if (state.menuOpen) {
    const menu = appRoot.querySelector('.card-foot .menu');
    if (menu && !menu.contains(e.target)) { menu.remove(); state.menuOpen = null; }
  }
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.menuOpen) { state.menuOpen = null; render(); return; }
  if (state.notifOpen) { closeNotify(); }
});

/* ═══ Go ═══ */
render();
</script>
</body>
</html>
